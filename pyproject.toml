[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-youtube-automation-pro"
version = "2.0.0"
description = "Original AI animated comedy: ideas, scripts, characters, images, voices, FFmpeg editing, thumbnails, SEO and YouTube upload with approval gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-dotenv>=1.0", "httpx>=0.27", "pillow>=10.3",
  "numpy>=1.26", "imageio-ffmpeg>=0.5", "anthropic>=2.6", "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2", "edge-tts>=6.1", "pyttsx3>=2.90", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ytauto = "ytauto.cli:main"

[tool.setuptools]
packages = ["ytauto", "ytauto.providers"]

[tool.setuptools.package-data]
ytauto = ["web/dist/*", "web/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
